# Builds a debug APK on every push (or by hand from the Actions tab).
# Download it from the run's "Artifacts" section, then install it on your phone.
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME)
      - name: Install packages
        run: npm ci

      - name: Copy game into the app
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: blackpool-after-dark-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
