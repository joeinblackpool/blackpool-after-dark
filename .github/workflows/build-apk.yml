# Builds a debug APK on every push (or by hand from the Actions tab).
# Download it from the run's "Artifacts" section, then install it on your phone.
name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME)
      - name: Install packages
        run: npm ci

      - name: Copy game into the app
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: blackpool-after-dark-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Phone-friendly download link that always points at the newest build:
      # https://github.com/joeinblackpool/blackpool-after-dark/releases/latest/download/blackpool-after-dark.apk
      - name: Publish APK as the latest release
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk blackpool-after-dark.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest blackpool-after-dark.apk \
            --title "Blackpool After Dark (Android)" \
            --notes "Newest Android build. On your phone, open this page, tap blackpool-after-dark.apk, then allow installing apps from your browser when asked." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
