# Publishes the web game in game/ to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at nintendo.org.uk (and joeinblackpool.github.io/blackpool-after-dark).
name: Publish game website

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add custom domain
        run: |
          echo "nintendo.org.uk" > game/CNAME
          touch game/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: game
          branch: gh-pages
